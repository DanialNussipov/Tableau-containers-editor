<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableau Style Manager</title>
    <style>
        :root {
            --bg: #f7f7f5;
            --card-bg: #ffffff;
            --border: #e9e9e7;
            --border-strong: #d8d8d4;
            --text: #37352f;
            --text-muted: #787066;
            --text-faint: #9b9589;
            --primary: #2383e2;
            --primary-hover: #0f74d4;
            --primary-soft: rgba(35, 131, 226, 0.12);
            --success: #0f9d58;
            --success-hover: #0b8049;
            --code-bg: #f1f0ee;
            --code-text: #c0564b;
            --danger-bg: #fdecea;
            --danger-border: #f5c6c0;
            --danger-text: #b4342a;
            --ok-bg: #e7f5ec;
            --ok-border: #bfe3cc;
            --ok-text: #0b7a3e;
            --radius: 10px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 48px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 44px 48px;
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04), 0 8px 28px rgba(15, 15, 15, 0.06);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.4px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14.5px;
            margin: 0 0 32px;
        }

        h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 16px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 7px;
            font-size: 13px;
            color: var(--text-muted);
        }

        label code, code {
            background: var(--code-bg);
            padding: 1.5px 6px;
            border-radius: 5px;
            color: var(--code-text);
            font-family: "SFMono-Regular", Consolas, Menlo, monospace;
            font-size: 12px;
        }

        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 11px 14px;
            background-color: #fff;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]::placeholder { color: var(--text-faint); }

        .color-picker-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            width: 46px;
            height: 42px;
            padding: 4px;
            background: #fff;
            cursor: pointer;
            flex-shrink: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }

        input[type="file"] {
            padding: 9px 12px;
            cursor: pointer;
            color: var(--text-muted);
        }
        input[type="file"]::file-selector-button {
            border: 1px solid var(--border-strong);
            background: var(--bg);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            margin-right: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
        }
        input[type="file"]::file-selector-button:hover { background: #efefed; }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .row { display: flex; gap: 16px; }
        .col { flex: 1; min-width: 0; }

        button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.15s, transform 0.08s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.99); }

        .btn-secondary {
            background-color: #fff;
            border: 1px solid var(--border-strong);
            color: var(--text);
        }
        .btn-secondary:hover { background-color: var(--bg); border-color: var(--text-faint); }

        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }

        .hidden { display: none; }

        .alert {
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .alert-error {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }
        .alert-success {
            background-color: var(--ok-bg);
            color: var(--ok-text);
            border: 1px solid var(--ok-border);
        }

        .console-box {
            background-color: #fbfbfa;
            color: var(--text);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            white-space: pre-wrap;
            margin-bottom: 20px;
            max-height: 320px;
            overflow-y: auto;
            font-size: 12.5px;
            line-height: 1.55;
        }
        .console-box::-webkit-scrollbar { width: 8px; }
        .console-box::-webkit-scrollbar-track { background: transparent; }
        .console-box::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

        hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 30px 0;
        }

        .tree-box {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            max-height: 360px;
            overflow: auto;
            background: #fbfbfa;
            margin-bottom: 10px;
        }
        .tree-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
        }
        .tree-row:hover { background: #f0f0ee; }
        .tree-row.selected { background: var(--primary-soft); }
        .tree-check {
            width: 16px; height: 16px;
            border: 1.5px solid var(--border-strong);
            border-radius: 5px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px; line-height: 1;
            color: #fff;
        }
        .tree-row.selected .tree-check { background: var(--primary); border-color: var(--primary); }
        .tree-type { font-weight: 600; }
        .tree-id, .tree-styles {
            font-family: "SFMono-Regular", Consolas, Menlo, monospace;
        }
        .tree-id { color: var(--text-faint); }
        .tree-name { color: var(--text-muted); }
        .tree-styles {
            color: var(--text-faint);
            font-size: 11.5px;
            margin-left: auto;
            padding-left: 14px;
        }

        @media (max-width: 560px) {
            .container { padding: 28px 22px; }
            .row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Tableau Style Manager</h1>
        <p class="subtitle">Анализ иерархий и пакетное редактирование стилей контейнеров в файлах .twb и .twbx</p>

        <div id="alert-box" class="alert hidden"></div>

        <!-- 1. Загрузка для JSON-анализа -->
        <div class="form-group">
            <label>1. Выберите файл (.twb или .twbx) <code>POST /upload</code></label>
            <input type="file" id="fileInput" accept=".twb, .twbx">
        </div>
        <div class="form-group">
            <button type="button" onclick="uploadFile()">Загрузить и проанализировать</button>
        </div>

        <!-- 2. Текстовый отчет по файлу -->
        <div class="form-group" style="margin-top: 15px;">
            <label>2. Полный текстовый отчет дерева <code>POST /upload_text</code></label>
            <button type="button" class="btn-secondary" onclick="uploadTextFile()">📄 Посмотреть сырой текст</button>
        </div>
        <div id="text-output-box" class="console-box hidden"></div>

        <!-- Интерактивная секция для модификации -->
        <div id="interactive-section" class="hidden">
            <hr>

            <div class="form-group">
                <label>Выберите целевой дашборд</label>
                <select id="dashboardSelect" onchange="selectedIds = new Set(); document.getElementById('zoneIds').value = ''; renderTree();"></select>
            </div>

            <hr>

            <h3>Пакетное изменение стилей <code>POST /modify</code></h3>

            <div class="form-group">
                <label>Контейнеры дашборда — кликните, чтобы выбрать</label>
                <div id="tree-box" class="tree-box"></div>
            </div>

            <div class="form-group">
                <label>Выбранные ID (можно править вручную)</label>
                <input type="text" id="zoneIds" placeholder="например: 2, 39, 105" oninput="syncZoneSelection()">
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Inner Padding</label>
                    <input type="text" id="innerPadding" value="10">
                </div>
                <div class="col form-group">
                    <label>Outer Padding</label>
                    <input type="text" id="outerPadding" value="0">
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Corner Radius ( >= 2026 )</label>
                    <input type="text" id="cornerRadius" value="0">
                </div>
                <div class="col form-group">
                    <label>Border Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="borderColorPicker" value="#000000" oninput="syncColor('borderColorPicker', 'borderColor')">
                        <input type="text" id="borderColor" placeholder="#000000" oninput="syncPicker('borderColor', 'borderColorPicker')">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Background Color</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bgColorPicker" value="#ffffff" oninput="syncColor('bgColorPicker', 'backgroundColor')">
                        <input type="text" id="backgroundColor" placeholder="#FFFFFF (или none)" oninput="syncPicker('backgroundColor', 'bgColorPicker')">
                    </div>
                </div>
                <div class="col form-group">
                    <label>Border Style</label>
                    <select id="borderStyle">
                        <option value="">(Не изменять)</option>
                        <option value="solid">solid</option>
                        <option value="none">none</option>
                        <option value="dotted">dotted</option>
                        <option value="dashed">dashed</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-top: 25px;">
                <button type="button" class="btn-success" onclick="applyStyles()">💾 Применить стили и скачать результат</button>
            </div>
        </div>
    </div>

    <script>
        let uploadedFilename = "";
        let allDashboards = {};
        let selectedIds = new Set();

        function esc(s) {
            const d = document.createElement("div");
            d.textContent = s == null ? "" : s;
            return d.innerHTML;
        }

        function renderTree() {
            const box = document.getElementById("tree-box");
            const root = allDashboards[document.getElementById("dashboardSelect").value];
            box.innerHTML = "";
            if (root) box.appendChild(buildRow(root, 0));
        }

        function buildRow(node, depth) {
            const frag = document.createDocumentFragment();
            const row = document.createElement("div");
            const isSel = selectedIds.has(node.id);
            row.className = "tree-row" + (isSel ? " selected" : "");
            row.style.paddingLeft = (8 + depth * 18) + "px";
            const styleStr = Object.entries(node.styles || {}).map(([k, v]) => `${k}=${v}`).join(", ");
            row.innerHTML =
                `<span class="tree-check">${isSel ? "✓" : ""}</span>` +
                `<span class="tree-type">${esc(node.type || "zone")}</span>` +
                (node.param ? `<span class="tree-name">(${esc(node.param)})</span>` : "") +
                `<span class="tree-id">#${esc(node.id)}</span>` +
                (node.name ? `<span class="tree-name">'${esc(node.name)}'</span>` : "") +
                (styleStr ? `<span class="tree-styles">${esc(styleStr)}</span>` : "");
            row.onclick = () => toggleZone(node.id);
            frag.appendChild(row);
            (node.children || []).forEach(c => frag.appendChild(buildRow(c, depth + 1)));
            return frag;
        }

        function toggleZone(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            document.getElementById("zoneIds").value = [...selectedIds].join(", ");
            renderTree();
        }

        // Когда ID правят вручную в текстовом поле — обновляем подсветку дерева
        function syncZoneSelection() {
            selectedIds = new Set(
                document.getElementById("zoneIds").value.split(",").map(s => s.trim()).filter(Boolean)
            );
            renderTree();
        }

        // Синхронизация между палитрой и текстовым полем
        function syncColor(pickerId, textId) {
            document.getElementById(textId).value = document.getElementById(pickerId).value.toUpperCase();
        }

        function syncPicker(textId, pickerId) {
            const val = document.getElementById(textId).value;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                document.getElementById(pickerId).value = val;
            }
        }

        function showAlert(message, isError = true) {
            const box = document.getElementById("alert-box");
            box.className = "alert " + (isError ? "alert-error" : "alert-success");
            box.innerText = message;
            box.classList.remove("hidden");
        }

        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0) {
                showAlert("Пожалуйста, выберите файл .twb или .twbx");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch("/upload", { method: "POST", body: formData });
                const data = await response.json();

                if (response.ok) {
                    uploadedFilename = data.filename;
                    allDashboards = data.dashboards || {};
                    selectedIds = new Set();
                    const select = document.getElementById("dashboardSelect");
                    select.innerHTML = "";

                    for (const [dashName] of Object.entries(allDashboards)) {
                        const opt = document.createElement("option");
                        opt.value = dashName;
                        opt.innerText = dashName;
                        select.appendChild(opt);
                    }

                    document.getElementById("zoneIds").value = "";
                    renderTree();
                    document.getElementById("interactive-section").classList.remove("hidden");
                    showAlert("Файл успешно загружен и проанализирован!", false);
                } else {
                    showAlert(data.detail || "Ошибка загрузки");
                }
            } catch (err) {
                showAlert("Ошибка соединения с сервером");
            }
        }

        async function uploadTextFile() {
            const fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0) {
                showAlert("Сначала выберите файл в поле выше");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const textBox = document.getElementById("text-output-box");
            textBox.innerText = "Генерация отчета...";
            textBox.classList.remove("hidden");

            try {
                const response = await fetch("/upload_text", { method: "POST", body: formData });
                const textResult = await response.text();

                if (response.ok) {
                    textBox.innerText = textResult;
                } else {
                    textBox.innerText = "Ошибка: " + textResult;
                }
            } catch (err) {
                textBox.innerText = "Ошибка соединения при запросе /upload_text";
            }
        }

        async function applyStyles() {
            const zoneIdsRaw = document.getElementById("zoneIds").value;
            const zoneIds = zoneIdsRaw.split(",").map(s => s.trim()).filter(Boolean);

            if (zoneIds.length === 0) {
                showAlert("Укажите хотя бы один ID контейнера");
                return;
            }

            const payload = {
                filename: uploadedFilename,
                dashboard_name: document.getElementById("dashboardSelect").value,
                zone_ids: zoneIds,
                inner_padding: parseInt(document.getElementById("innerPadding").value) || null,
                outer_padding: parseInt(document.getElementById("outerPadding").value) || null,
                corner_radius: parseInt(document.getElementById("cornerRadius").value) || null,
                border_color: document.getElementById("borderColor").value || null,
                background_color: document.getElementById("backgroundColor").value || null,
                border_style: document.getElementById("borderStyle").value || null
            };

            try {
                const response = await fetch("/modify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "modified_" + uploadedFilename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    showAlert("Стили применены, файл успешно скачивается!", false);
                } else {
                    const err = await response.json();
                    let msg = err.detail;
                    if (Array.isArray(err.detail)) {
                        msg = err.detail.map(e => e.msg).join("; ");
                    }
                    showAlert("Ошибка валидации: " + msg);
                }
            } catch (err) {
                showAlert("Ошибка при отправке запроса /modify");
            }
        }
    </script>
</body>
</html>
