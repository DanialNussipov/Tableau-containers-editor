<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableau Style Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #ececec;
            --border-strong: #e0e0e0;
            --border-hover: #cfcfcf;
            --text: #141414;
            --text-2: #5c5c5c;
            --text-3: #9a9a9a;
            --accent: #4f46e5;
            --accent-soft: #eef0fe;
            --accent-border: #c9ccfb;
            --ink: #141414;
            --ink-hover: #000000;
            --ok: #0a7d44;
            --ok-soft: #e9f6ef;
            --ok-border: #c3e6d2;
            --err: #c0362c;
            --err-soft: #fdecea;
            --err-border: #f3c9c3;
            --mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
            --r: 10px;
            --r-lg: 14px;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 56px 20px 96px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            font-feature-settings: "cv05", "ss01";
        }

        .app { width: 100%; max-width: 680px; }

        /* ---------- Header ---------- */
        .masthead { margin-bottom: 36px; }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }
        .brand .mark {
            width: 30px; height: 30px;
            border-radius: 9px;
            background: var(--ink);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .brand .wordmark {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-2);
        }
        h1 {
            font-size: 30px;
            font-weight: 650;
            letter-spacing: -0.03em;
            margin: 0 0 8px;
            line-height: 1.15;
        }
        .lede {
            color: var(--text-2);
            font-size: 15px;
            margin: 0;
            max-width: 48ch;
        }

        /* ---------- Card / sections ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            box-shadow: 0 1px 2px rgba(20, 20, 20, 0.03), 0 10px 30px -18px rgba(20, 20, 20, 0.12);
            overflow: hidden;
        }
        .section { padding: 26px 28px; }
        .section + .section { border-top: 1px solid var(--border); }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 16px;
        }
        .eyebrow .step {
            width: 20px; height: 20px;
            border-radius: 6px;
            background: var(--bg);
            border: 1px solid var(--border-strong);
            color: var(--text-2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            letter-spacing: 0;
        }

        /* ---------- Dropzone ---------- */
        .dropzone {
            border: 1.5px dashed var(--border-hover);
            border-radius: var(--r);
            padding: 30px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color .18s, background .18s;
            background: #fcfcfc;
        }
        .dropzone:hover { border-color: var(--text-3); background: #fafafa; }
        .dropzone.dragover { border-color: var(--accent); background: var(--accent-soft); }
        .dropzone .dz-icon { color: var(--text-3); margin-bottom: 12px; display: inline-flex; }
        .dropzone.dragover .dz-icon { color: var(--accent); }
        .dz-title { font-size: 14.5px; font-weight: 500; }
        .dz-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; }
        .dz-file {
            display: none;
            align-items: center;
            gap: 10px;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
        }
        .dz-file .fchip {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--bg);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 7px 12px;
            max-width: 100%;
        }
        .dz-file .fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dz-file .fchip svg { color: var(--text-3); flex-shrink: 0; }
        .has-file .dz-prompt { display: none; }
        .has-file .dz-file { display: flex; }

        .actions { display: flex; gap: 10px; margin-top: 18px; }

        /* ---------- Buttons ---------- */
        button, .btn {
            font-family: inherit;
            font-size: 14px;
            font-weight: 550;
            border-radius: 9px;
            cursor: pointer;
            border: 1px solid transparent;
            padding: 10px 16px;
            transition: background .15s, border-color .15s, color .15s, transform .06s, box-shadow .15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active:not(:disabled) { transform: translateY(0.5px); }
        button:disabled { opacity: .45; cursor: not-allowed; }

        .btn-primary { background: var(--ink); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--ink-hover); }

        .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
        .btn-ghost:hover:not(:disabled) { border-color: var(--border-hover); background: #fcfcfc; }

        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover:not(:disabled) { background: #413bc9; box-shadow: 0 6px 18px -8px rgba(79,70,229,.6); }

        .flex1 { flex: 1; }

        /* ---------- Forms ---------- */
        .field { margin-bottom: 18px; }
        .field:last-child { margin-bottom: 0; }
        label.lbl {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: 7px;
        }

        .input, select.input {
            width: 100%;
            padding: 10px 13px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
            -webkit-appearance: none;
            appearance: none;
        }
        .input::placeholder { color: var(--text-3); }
        .input:focus, select.input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3.5px var(--accent-soft);
        }
        select.input {
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239a9a9a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 38px;
            cursor: pointer;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* color control */
        .color-ctl { display: flex; gap: 8px; align-items: center; }
        .swatch {
            position: relative;
            width: 40px; height: 40px;
            border-radius: 9px;
            border: 1px solid var(--border-strong);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }
        .swatch input[type="color"] {
            position: absolute; inset: -4px;
            width: calc(100% + 8px); height: calc(100% + 8px);
            border: none; padding: 0; background: none; cursor: pointer;
        }
        .color-ctl .input { font-family: var(--mono); font-size: 13px; }

        /* ---------- Tree ---------- */
        .tree-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .tree-head .lbl { margin: 0; }
        .count-pill {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .count-pill b { color: var(--accent); font-weight: 600; }
        .link-btn {
            background: none; border: none; padding: 0;
            color: var(--text-3); font-size: 12.5px; font-weight: 500;
            cursor: pointer; width: auto;
        }
        .link-btn:hover { color: var(--text); }

        .tree-box {
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 5px;
            max-height: 340px;
            overflow: auto;
            background: #fcfcfc;
        }
        .tree-empty { padding: 28px 16px; text-align: center; color: var(--text-3); font-size: 13px; }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 6px 9px;
            border-radius: 7px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            transition: background .1s;
        }
        .tree-row:hover { background: #f1f1f1; }
        .tree-row.selected { background: var(--accent-soft); }
        .tree-check {
            width: 17px; height: 17px;
            border: 1.5px solid var(--border-hover);
            border-radius: 5px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: background .12s, border-color .12s;
        }
        .tree-check svg { opacity: 0; }
        .tree-row.selected .tree-check { background: var(--accent); border-color: var(--accent); }
        .tree-row.selected .tree-check svg { opacity: 1; }
        .tree-type { font-weight: 550; }
        .tree-id { font-family: var(--mono); color: var(--text-3); font-size: 12px; }
        .tree-name { color: var(--text-2); }
        .tree-styles {
            font-family: var(--mono);
            color: var(--text-3);
            font-size: 11.5px;
            margin-left: auto;
            padding-left: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- Console ---------- */
        .console-box {
            background: #141414;
            color: #e8e8e8;
            padding: 16px 18px;
            border-radius: var(--r);
            font-family: var(--mono);
            white-space: pre;
            overflow: auto;
            max-height: 320px;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 14px;
        }

        /* ---------- Alert ---------- */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 15px;
            border-radius: var(--r);
            margin-bottom: 20px;
            font-size: 13.5px;
            border: 1px solid transparent;
        }
        .alert svg { flex-shrink: 0; margin-top: 1px; }
        .alert-error { background: var(--err-soft); color: var(--err); border-color: var(--err-border); }
        .alert-success { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }

        .hidden { display: none !important; }

        /* scrollbars */
        .tree-box::-webkit-scrollbar, .console-box::-webkit-scrollbar { width: 9px; height: 9px; }
        .tree-box::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid #fcfcfc; }
        .console-box::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; }
        .tree-box::-webkit-scrollbar-track, .console-box::-webkit-scrollbar-track { background: transparent; }

        @media (max-width: 560px) {
            body { padding: 36px 16px 72px; }
            .section { padding: 22px 18px; }
            h1 { font-size: 25px; }
            .grid { grid-template-columns: 1fr; gap: 14px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="masthead">
            <div class="brand">
                <span class="mark">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                </span>
                <span class="wordmark">Tableau&nbsp;·&nbsp;Style Manager</span>
            </div>
            <h1>Редактор стилей контейнеров</h1>
            <p class="lede">Загрузите <b>.twb</b> или <b>.twbx</b>, выберите контейнеры в дереве макета и примените отступы, скругления и границы пакетно.</p>
        </header>

        <div id="alert-box" class="alert hidden"></div>

        <div class="card">
            <!-- Step 1: upload -->
            <div class="section">
                <div class="eyebrow"><span class="step">1</span> Файл дашборда</div>

                <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" accept=".twb, .twbx" class="hidden" onchange="onFilePicked()">
                    <div class="dz-prompt">
                        <span class="dz-icon">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        </span>
                        <div class="dz-title">Перетащите файл сюда</div>
                        <div class="dz-sub">или нажмите, чтобы выбрать · .twb, .twbx</div>
                    </div>
                    <div class="dz-file">
                        <span class="fchip">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            <span id="file-name"></span>
                        </span>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn-primary flex1" id="analyzeBtn" onclick="uploadFile()" disabled>Проанализировать</button>
                    <button type="button" class="btn-ghost" onclick="uploadTextFile()">Сырой отчёт</button>
                </div>

                <div id="text-output-box" class="console-box hidden"></div>
            </div>

            <!-- Step 2: editor -->
            <div id="interactive-section" class="section hidden">
                <div class="eyebrow"><span class="step">2</span> Контейнеры и стили</div>

                <div class="field">
                    <label class="lbl" for="dashboardSelect">Дашборд</label>
                    <select id="dashboardSelect" class="input" onchange="selectedIds = new Set(); document.getElementById('zoneIds').value = ''; renderTree();"></select>
                </div>

                <div class="field">
                    <div class="tree-head">
                        <label class="lbl">Макет — выберите контейнеры</label>
                        <span class="count-pill"><span id="sel-count">Ничего не выбрано</span><button type="button" class="link-btn hidden" id="clearBtn" onclick="clearSelection()">Сбросить</button></span>
                    </div>
                    <div id="tree-box" class="tree-box"></div>
                </div>

                <div class="field">
                    <label class="lbl" for="zoneIds">ID выбранных контейнеров</label>
                    <input type="text" id="zoneIds" class="input" placeholder="например: 2, 39, 105" oninput="syncZoneSelection()" style="font-family: var(--mono); font-size: 13px;">
                </div>

                <div class="grid" style="margin-bottom: 16px;">
                    <div>
                        <label class="lbl">Inner padding</label>
                        <input type="text" id="innerPadding" class="input" value="10">
                    </div>
                    <div>
                        <label class="lbl">Outer padding</label>
                        <input type="text" id="outerPadding" class="input" value="0">
                    </div>
                </div>

                <div class="grid" style="margin-bottom: 16px;">
                    <div>
                        <label class="lbl">Corner radius <span style="color:var(--text-3)">· 2026+</span></label>
                        <input type="text" id="cornerRadius" class="input" value="0">
                    </div>
                    <div>
                        <label class="lbl">Border style</label>
                        <select id="borderStyle" class="input">
                            <option value="">Не изменять</option>
                            <option value="solid">solid</option>
                            <option value="none">none</option>
                            <option value="dotted">dotted</option>
                            <option value="dashed">dashed</option>
                        </select>
                    </div>
                </div>

                <div class="grid">
                    <div>
                        <label class="lbl">Border color</label>
                        <div class="color-ctl">
                            <span class="swatch"><input type="color" id="borderColorPicker" value="#000000" oninput="syncColor('borderColorPicker', 'borderColor')"></span>
                            <input type="text" id="borderColor" class="input" placeholder="#000000" oninput="syncPicker('borderColor', 'borderColorPicker')">
                        </div>
                    </div>
                    <div>
                        <label class="lbl">Background</label>
                        <div class="color-ctl">
                            <span class="swatch"><input type="color" id="bgColorPicker" value="#ffffff" oninput="syncColor('bgColorPicker', 'backgroundColor')"></span>
                            <input type="text" id="backgroundColor" class="input" placeholder="#FFFFFF / none" oninput="syncPicker('backgroundColor', 'bgColorPicker')">
                        </div>
                    </div>
                </div>

                <div class="actions" style="margin-top: 24px;">
                    <button type="button" class="btn-accent flex1" id="applyBtn" onclick="applyStyles()" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Применить и скачать
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let uploadedFilename = "";
        let allDashboards = {};
        let selectedIds = new Set();

        const CHECK_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

        function esc(s) {
            const d = document.createElement("div");
            d.textContent = s == null ? "" : s;
            return d.innerHTML;
        }

        /* ---------- Upload UI ---------- */
        function onFilePicked() {
            const f = document.getElementById("fileInput").files[0];
            const dz = document.getElementById("dropzone");
            if (f) {
                document.getElementById("file-name").textContent = f.name;
                dz.classList.add("has-file");
                document.getElementById("analyzeBtn").disabled = false;
            } else {
                dz.classList.remove("has-file");
                document.getElementById("analyzeBtn").disabled = true;
            }
        }

        (function setupDnd() {
            const dz = document.getElementById("dropzone");
            ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => {
                e.preventDefault(); dz.classList.add("dragover");
            }));
            ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => {
                e.preventDefault();
                if (ev === "dragleave" && dz.contains(e.relatedTarget)) return;
                dz.classList.remove("dragover");
            }));
            dz.addEventListener("drop", e => {
                const file = e.dataTransfer.files[0];
                if (!file) return;
                const dt = new DataTransfer();
                dt.items.add(file);
                document.getElementById("fileInput").files = dt.files;
                onFilePicked();
            });
        })();

        /* ---------- Alerts ---------- */
        const ICON_ERR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
        const ICON_OK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        function showAlert(message, isError = true) {
            const box = document.getElementById("alert-box");
            box.className = "alert " + (isError ? "alert-error" : "alert-success");
            box.innerHTML = (isError ? ICON_ERR : ICON_OK) + "<span>" + esc(message) + "</span>";
            box.classList.remove("hidden");
        }

        /* ---------- Tree ---------- */
        function renderTree() {
            const box = document.getElementById("tree-box");
            const root = allDashboards[document.getElementById("dashboardSelect").value];
            box.innerHTML = "";
            if (root) box.appendChild(buildRow(root, 0));
            else box.innerHTML = '<div class="tree-empty">Контейнеры не найдены</div>';
            updateSelectionUI();
        }

        function buildRow(node, depth) {
            const frag = document.createDocumentFragment();
            const row = document.createElement("div");
            const isSel = selectedIds.has(node.id);
            row.className = "tree-row" + (isSel ? " selected" : "");
            row.style.paddingLeft = (9 + depth * 18) + "px";
            const styleStr = Object.entries(node.styles || {}).map(([k, v]) => `${k}=${v}`).join("  ");
            row.innerHTML =
                `<span class="tree-check">${CHECK_SVG}</span>` +
                `<span class="tree-type">${esc(node.type || "zone")}</span>` +
                (node.param ? `<span class="tree-name">(${esc(node.param)})</span>` : "") +
                `<span class="tree-id">#${esc(node.id)}</span>` +
                (node.name ? `<span class="tree-name">'${esc(node.name)}'</span>` : "") +
                (styleStr ? `<span class="tree-styles">${esc(styleStr)}</span>` : "");
            row.onclick = () => toggleZone(node.id);
            frag.appendChild(row);
            (node.children || []).forEach(c => frag.appendChild(buildRow(c, depth + 1)));
            return frag;
        }

        function toggleZone(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            document.getElementById("zoneIds").value = [...selectedIds].join(", ");
            renderTree();
        }

        function syncZoneSelection() {
            selectedIds = new Set(
                document.getElementById("zoneIds").value.split(",").map(s => s.trim()).filter(Boolean)
            );
            renderTree();
        }

        function clearSelection() {
            selectedIds = new Set();
            document.getElementById("zoneIds").value = "";
            renderTree();
        }

        function updateSelectionUI() {
            const n = selectedIds.size;
            const label = document.getElementById("sel-count");
            if (label) label.innerHTML = n ? `Выбрано <b>${n}</b>` : "Ничего не выбрано";
            const clr = document.getElementById("clearBtn");
            if (clr) clr.classList.toggle("hidden", n === 0);
            const apply = document.getElementById("applyBtn");
            if (apply) apply.disabled = n === 0;
        }

        /* ---------- Colors ---------- */
        function syncColor(pickerId, textId) {
            document.getElementById(textId).value = document.getElementById(pickerId).value.toUpperCase();
        }
        function syncPicker(textId, pickerId) {
            const val = document.getElementById(textId).value;
            if (/^#[0-9A-F]{6}$/i.test(val)) document.getElementById(pickerId).value = val;
        }

        /* ---------- API ---------- */
        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0) { showAlert("Выберите файл .twb или .twbx"); return; }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch("/upload", { method: "POST", body: formData });
                const data = await response.json();
                if (response.ok) {
                    uploadedFilename = data.filename;
                    allDashboards = data.dashboards || {};
                    selectedIds = new Set();
                    const select = document.getElementById("dashboardSelect");
                    select.innerHTML = "";
                    for (const [dashName] of Object.entries(allDashboards)) {
                        const opt = document.createElement("option");
                        opt.value = dashName;
                        opt.innerText = dashName;
                        select.appendChild(opt);
                    }
                    document.getElementById("zoneIds").value = "";
                    renderTree();
                    document.getElementById("interactive-section").classList.remove("hidden");
                    showAlert("Файл проанализирован — найдено дашбордов: " + Object.keys(allDashboards).length, false);
                } else {
                    showAlert(data.detail || "Ошибка загрузки");
                }
            } catch (err) {
                showAlert("Ошибка соединения с сервером");
            }
        }

        async function uploadTextFile() {
            const fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0) { showAlert("Сначала выберите файл выше"); return; }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const textBox = document.getElementById("text-output-box");
            textBox.textContent = "Генерация отчёта…";
            textBox.classList.remove("hidden");

            try {
                const response = await fetch("/upload_text", { method: "POST", body: formData });
                const textResult = await response.text();
                textBox.textContent = response.ok ? textResult : "Ошибка: " + textResult;
            } catch (err) {
                textBox.textContent = "Ошибка соединения при запросе /upload_text";
            }
        }

        async function applyStyles() {
            const zoneIds = document.getElementById("zoneIds").value.split(",").map(s => s.trim()).filter(Boolean);
            if (zoneIds.length === 0) { showAlert("Выберите хотя бы один контейнер"); return; }

            const payload = {
                filename: uploadedFilename,
                dashboard_name: document.getElementById("dashboardSelect").value,
                zone_ids: zoneIds,
                inner_padding: parseInt(document.getElementById("innerPadding").value) || null,
                outer_padding: parseInt(document.getElementById("outerPadding").value) || null,
                corner_radius: parseInt(document.getElementById("cornerRadius").value) || null,
                border_color: document.getElementById("borderColor").value || null,
                background_color: document.getElementById("backgroundColor").value || null,
                border_style: document.getElementById("borderStyle").value || null
            };

            try {
                const response = await fetch("/modify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "modified_" + uploadedFilename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    showAlert("Стили применены — файл скачивается", false);
                } else {
                    const err = await response.json();
                    let msg = err.detail;
                    if (Array.isArray(err.detail)) msg = err.detail.map(e => e.msg).join("; ");
                    showAlert("Ошибка: " + msg);
                }
            } catch (err) {
                showAlert("Ошибка при отправке запроса /modify");
            }
        }
    </script>
</body>
